<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Give Yourself A Reason </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #263746;
            font-family: "Times New Roman", serif;
            overflow: hidden;
        }

        .intro {
            height: 100vh;
            width: 100%;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* NASLOV */

        .title {
            text-align: center;
            z-index: 10;

            opacity: 0;
            animation: appear 1.5s ease forwards;
            animation-delay: 1.5s;
        }

        .title h1 {
            font-size: clamp(38px, 7vw, 85px);
            margin: 0;
            letter-spacing: 3px;
            font-weight: normal;
        }

        .title p {
            font-size: 18px;
            margin-top: 15px;
            font-style: italic;
        }

        /* RAZLOGI */

        .reason {
            position: absolute;

            padding: 9px 15px;

            background: white;
            border: 1px solid #9bb2c8;

            box-shadow: 3px 3px 0 #c8d5e1;

            font-size: 16px;

            opacity: 0;

            animation:
                flyIn 1.2s cubic-bezier(.2,.8,.2,1) forwards,
                float 4s ease-in-out infinite;

            animation-delay: var(--delay), calc(var(--delay) + 1.2s);
        }

        /* POLOŽAJI */

        .r1 {
            left: 8%;
            top: 18%;
            --delay: 0.2s;
        }

        .r2 {
            left: 67%;
            top: 15%;
            --delay: 0.5s;
        }

        .r3 {
            left: 18%;
            top: 42%;
            --delay: 0.8s;
        }

        .r4 {
            right: 8%;
            top: 43%;
            --delay: 1.1s;
        }

        .r5 {
            left: 10%;
            bottom: 18%;
            --delay: 1.4s;
        }

        .r6 {
            right: 13%;
            bottom: 17%;
            --delay: 1.7s;
        }

        .r7 {
            left: 40%;
            top: 12%;
            --delay: 2s;
        }

        .r8 {
            right: 35%;
            bottom: 11%;
            --delay: 2.3s;
        }

        /* GUMB */

        .continue {
            position: absolute;

            bottom: 35px;
            left: 50%;

            transform: translateX(-50%);

            padding: 12px 25px;

            background: #263746;
            color: white;

            border: none;

            font-family: "Times New Roman", serif;
            font-size: 17px;

            cursor: pointer;

            opacity: 0;

            animation: appear 1s ease forwards;
            animation-delay: 4s;
        }

        .continue:hover {
            background: #3f6f95;
        }

        /* ANIMACIJE */

        @keyframes flyIn {

            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0.5);
            }

            70% {
                opacity: 1;
                transform: translateY(-15px) scale(1.05);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {

            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -7px;
            }
        }

        @keyframes appear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* TELEFON */

        @media (max-width: 600px) {

            .reason {
                font-size: 13px;
                padding: 7px 10px;
            }

            .r1 {
                left: 4%;
                top: 15%;
            }

            .r2 {
                right: 4%;
                left: auto;
                top: 22%;
            }

            .r3 {
                left: 3%;
                top: 35%;
            }

            .r4 {
                right: 3%;
                top: 39%;
            }

            .r5 {
                left: 5%;
                bottom: 23%;
            }

            .r6 {
                right: 5%;
                bottom: 28%;
            }

            .r7 {
                left: 25%;
                top: 9%;
            }

            .r8 {
                right: 20%;
                bottom: 12%;
            }

            .title h1 {
                font-size: 42px;
            }
        }

    </style>
</head>


<body>

    <main class="intro">


        <!-- RAZLOGI -->

        <div class="reason r1">
            
            ljudje, ki te imajo radi
        </div>

        <div class="reason r2">
            
            glasba, ki jo še nisi slišal/a
        </div>

        <div class="reason r3">
            
            jutra, ki jih še nisi doživel/a
        </div>

        <div class="reason r4">
            
            stvari, ki jih še nisi poskusil/a
        </div>

        <div class="reason r5">
            
            tvoji mali trenutki sreče
        </div>

        <div class="reason r6">
            
            ljudje, ki jih še nisi spoznal/a
        </div>

        <div class="reason r7">
            
            tvoje sanje
        </div>

        <div class="reason r8">
            
            zgodbe, ki jih še nisi napisal/a
        </div>


        <!-- GLAVNI NASLOV -->

        <div class="title">

            <h1>
                GIVE YOURSELF<br>
                A REASON
            </h1>

            <p>
                nisi sam/a.
            </p>

        </div>


        <!-- GUMB -->

        <button class="continue" onclick="goNext()">
            vstopi →
        </button>


    </main>


    <script>

        function goNext() {

            window.location.href = "home.html";

        }

    </script>

</body>
</html>
```
