<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tvoje ideje ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}header{text-align:center;padding:45px 20px 30px;border-bottom:2px dashed #d9a9bf}h1{margin:0;color:#9b4f70;font-size:42px}.container{max-width:760px;margin:45px auto;padding:0 20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}h2{text-align:center;color:#9b4f70}label{display:block;margin:18px 0 7px;color:#75465a;font-weight:bold}input,textarea{width:100%;padding:12px;border:1px dashed #c98ba8;background:#fffafd;font:16px "Times New Roman",serif}textarea{min-height:170px;resize:vertical}button{display:block;margin:25px auto;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.note,.status{text-align:center;color:#765463;line-height:1.5}</style></head><body><header><h1>♥ GIVE YOURSELF A REASON ♥</h1><p>tvoje ideje ♡</p></header><div class="container"><section class="box"><h2>imaš idejo za stran?</h2><p style="text-align:center">Prijavi se in pošlji idejo. ♡</p><form id="form"><label>vzdevek (ne pravo ime)</label><input id="nickname" maxlength="30" required><label>tvoja ideja</label><textarea id="idea" maxlength="1000" required></textarea><p class="note">Ne piši pravega imena, naslova, telefonske številke ali drugih osebnih podatkov.</p><button>pošlji idejo ♡</button></form><p class="status" id="status"></p></section></div><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let user;async function init(){const {data:{session}}=await c.auth.getSession();if(!session){location.href='login.html';return}user=session.user}init();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await c.from('ideas').insert({user_id:user.id,nickname:document.getElementById('nickname').value.trim(),idea:document.getElementById('idea').value.trim()});document.getElementById('status').textContent=r.error?'Ideje ni bilo mogoče poslati.':'hvala za idejo ♡ uspešno je shranjena.';if(!r.error)e.target.reset()};</script></body></html>
