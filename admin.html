<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}.container{max-width:900px;margin:60px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}.idea{background:#fffafd;border:1px dashed #d9a9bf;padding:18px;margin:18px 0}.idea strong{color:#9b4f70}.idea-text{margin-top:10px;white-space:pre-wrap;line-height:1.5}.meta{font-size:13px;color:#765463;margin-top:8px}.empty{text-align:center;color:#765463;font-style:italic}.chat-box{background:#fff;border:1px dashed #d9a9bf;padding:18px;margin-top:18px}.chat-msg{margin:10px 0;line-height:1.5}.chat-msg strong{color:#d95b83}.chat-form{display:flex;gap:8px;margin-top:15px}.chat-form input{flex:1;padding:10px;border:1px solid #d9a9bf;font:16px "Times New Roman",serif}.chat-form button{margin:0}button{display:block;margin:20px auto;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.danger{background:#fff0f5}.error{background:#fff0f5;border:1px dashed #c77b98;padding:12px;line-height:1.5}</style></head><body><a href="home.html" style="position:fixed;top:16px;left:16px;z-index:9999;padding:8px 14px;border:1px dashed #a95778;background:#fff;color:#713b54;font:16px &quot;Times New Roman&quot;,serif;text-decoration:none">← domov</a><div class="container"><section class="box"><h1 style="text-align:center;color:#9b4f70">♥ GIVE YOURSELF A REASON ♥</h1><p style="text-align:center;color:#765463;line-height:1.5">Kot HOST lahko sodeluješ v skupnem chatu. Zasebnih pogovorov uporabnikov tukaj ne prikazujemo. ♡</p><div style="text-align:center;margin:20px 0 25px"><button id="showGroup" style="display:inline-block;margin:0 6px">skupni chat ♡</button><button id="showIdeas" style="display:inline-block;margin:0 6px">ideje ♡</button></div><div id="ideasSection" style="display:none"><h2 style="text-align:center">prejete ideje ♡</h2><div id="list"><p class="empty">nalagam... ♡</p></div></div><div id="chatList"><h2 style="text-align:center">skupni chat ♡</h2><p class="empty">nalagam...</p></div><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px"><a href="home.html" style="display:inline-block;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px &quot;Times New Roman&quot;,serif;text-decoration:none">← domov</a><button id="logout" style="margin:0">odjava</button></div></section></div><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function init(){const {data:{session}}=await c.auth.getSession();if(!session){location.href='login.html';return}const a=await c.rpc('is_admin');if(a.error||!a.data){document.body.innerHTML='<div style="max-width:600px;margin:80px auto;text-align:center;font-family:serif"><h1>Dostop ni dovoljen ♡</h1></div>';return}loadGroup()}async function load(){const r=await c.from('ideas').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<p class="error">Napaka pri nalaganju idej: '+esc(r.error.message)+'</p>';return}if(!r.data.length){$('list').innerHTML='<p class="empty">Trenutno še ni idej. ♡</p>';return}$('list').innerHTML=r.data.map(x=>'<article class="idea"><strong>♡ '+esc(x.nickname)+'</strong><div class="idea-text">'+esc(x.idea)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('sl-SI')+'</div><button class="danger" onclick="del('+x.id+')">izbriši</button></article>').join('')}async function del(id){if(!confirm('Izbrišem idejo?'))return;await c.from('ideas').delete().eq('id',id);load()}document.getElementById('showGroup').onclick=()=>{document.getElementById('ideasSection').style.display='none';document.getElementById('chatList').style.display='block';loadGroup()};document.getElementById('showIdeas').onclick=()=>{document.getElementById('chatList').style.display='none';document.getElementById('ideasSection').style.display='block';load()};async function loadGroup(){const r=await c.from('group_messages').select('*').order('created_at',{ascending:true});const box=$('chatList');if(r.error){box.innerHTML='<h2 style="text-align:center">skupni chat ♡</h2><p class="error">Skupnega chata ni bilo mogoče naložiti: '+esc(r.error.message)+'<br><small>Če se tabela/policies še niso osvežili, v Supabase SQL Editor ponovno zaženi celoten supabase.sql.</small></p>';return}box.innerHTML='<h2 style="text-align:center">skupni chat ♡</h2><div class="chat-box">'+(r.data.length?r.data.map(m=>'<div class="chat-msg"><strong>'+(m.role==='assistant'?'HOST':'uporabnik')+':</strong> '+esc(m.content)+'</div>').join(''):'<p class="empty">Še ni sporočil.</p>')+'<div class="chat-form"><input id="groupInput" maxlength="5000" placeholder="napiši kot HOST..."><button onclick="sendGroupHost()">pošlji ♡</button></div></div>'}async function sendGroupHost(){const i=$('groupInput'),text=i.value.trim();if(!text)return;const u=await c.auth.getUser();if(!u.data.user){alert('Seja je potekla. Prijavi se znova.');return}const r=await c.from('group_messages').insert({user_id:u.data.user.id,role:'assistant',content:text});if(r.error){alert('Sporočila ni bilo mogoče poslati: '+r.error.message);return}loadGroup()}$('logout').onclick=async()=>{await c.auth.signOut();location.href='login.html'};init();</script></body></html>
