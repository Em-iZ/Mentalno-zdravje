<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin </title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#263746;font-family:"Times New Roman",serif}.container{max-width:900px;margin:60px auto;padding:20px}.box{background:#fff;border:1px dashed #9bb2c8;box-shadow:6px 7px 0 #d9e3ec;padding:30px}.special-corner{max-width:1000px;margin:35px auto 15px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}.special-note{width:250px;min-height:175px;padding:22px 20px;background:#f7f9fb;position:relative;text-align:center;box-shadow:6px 7px 0 #d9e3ec;border-top:1px solid #c8d5e1;border-left:1px dashed #9bb2c8;border-right:1px dashed #9bb2c8;border-bottom:1px dashed #9bb2c8;transform:rotate(-1.5deg)}.special-note:nth-child(2){transform:rotate(1.5deg);background:#f5f7fa}.special-note:nth-child(3){transform:rotate(-.7deg);background:#fffafd}.special-note:hover{transform:rotate(0deg) translateY(-4px)}.special-note .special-note h3{margin:8px 0 7px;font-size:23px;font-weight:normal}.special-note p{margin:0 0 13px;font-size:15px;line-height:1.5}.special-note button{margin:0;padding:8px 14px;border:0;background:transparent;color:#3f6f95;font:15px "Times New Roman",serif;cursor:pointer}.special-note button:hover{text-decoration:underline}.section{margin-top:35px}.section h2{text-align:center;font-weight:normal}.idea{background:#fffafd;border:1px dashed #9bb2c8;padding:18px;margin:18px 0}.idea strong{color:#9b4f70}.idea-text{margin-top:10px;white-space:pre-wrap;line-height:1.5}.meta{font-size:13px;color:#765463;margin-top:8px}.empty{text-align:center;color:#765463;font-style:italic}.chat-box{background:#fff;border:1px dashed #9bb2c8;padding:18px;margin-top:18px}.chat-msg{margin:10px 0;line-height:1.5}.chat-msg strong{color:#3f6f95}.chat-form{display:flex;gap:8px;margin-top:15px}.chat-form input{flex:1;padding:10px;border:1px solid #9bb2c8;font:16px "Times New Roman",serif}.chat-form button{margin:0}.action{display:block;margin:20px auto;padding:11px 25px;border:1px dashed #5d7891;background:#e9eff5;color:#40586d;font:17px "Times New Roman",serif;cursor:pointer}.danger{background:#fff0f5}.error{background:#fff0f5;border:1px dashed #c77b98;padding:12px;line-height:1.5}.back{display:block;width:max-content;margin:25px auto 0;color:#3f6f95;text-decoration:none}.back:hover{text-decoration:underline}@media(max-width:650px){.container{margin:35px auto;padding:15px}.box{padding:20px}.special-corner{gap:20px}.special-note{width:min(280px,90%)}}</style></head><body><a href="home.html" style="position:fixed;top:16px;left:16px;z-index:9999;padding:8px 14px;border:1px dashed #5d7891;background:#fff;color:#40586d;font:16px &quot;Times New Roman&quot;,serif;text-decoration:none">← domov</a><div class="container"><section class="box"><h1 style="text-align:center;color:#9b4f70"> GIVE YOURSELF A REASON </h1><p style="text-align:center;color:#765463;line-height:1.5">Admin kotiček </p><div id="homeMenu" class="special-corner"><div class="special-note"><h3>ideje</h3><p>Ideje uporabnikov za stran.</p><button onclick="showSection('ideas')">odpri ideje →</button></div></div></div><div id="ideasSection" class="section" style="display:none"><h2>ideje </h2><div id="list"><p class="empty">nalagam...</p></div><button class="action" onclick="showMenu()">← nazaj</button></div><div style="display:flex;justify-content:center;margin-top:25px"><button id="logout" class="action">odjava</button></div></section></div><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);async function init(){const {data:{session}}=await c.auth.getSession();if(!session){location.href='login.html?admin=1';return}const a=await c.rpc('is_admin');if(a.error||!a.data){document.body.innerHTML='<div style="max-width:600px;margin:80px auto;text-align:center;font-family:serif"><h1>Dostop ni dovoljen </h1></div>';return}}function showMenu(){$('homeMenu').style.display='flex';$('ideasSection').style.display='none'}function showSection(which){$('homeMenu').style.display='none';$('ideasSection').style.display='block';loadIdeas()}async function loadIdeas(){const r=await c.from('ideas').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<p class="error">Napaka pri nalaganju idej: '+esc(r.error.message)+'</p>';return}if(!r.data.length){$('list').innerHTML='<p class="empty">Trenutno še ni idej. </p>';return}$('list').innerHTML=r.data.map(x=>'<article class="idea"><strong> '+esc(x.nickname)+'</strong><div class="idea-text">'+esc(x.idea)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('sl-SI')+'</div><button class="action danger" onclick="del('+x.id+')">izbriši</button></article>').join('')}async function del(id){if(!confirm('Izbrišem idejo?'))return;await c.from('ideas').delete().eq('id',id);loadIdeas()}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}$('logout').onclick=async()=>{await c.auth.signOut();location.href='home.html'};init();</script></body></html>
