<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}.container{max-width:900px;margin:60px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}.idea{background:#fffafd;border:1px dashed #d9a9bf;padding:18px;margin:18px 0}.idea strong{color:#9b4f70}.idea-text{margin-top:10px;white-space:pre-wrap;line-height:1.5}.meta{font-size:13px;color:#765463;margin-top:8px}.empty{text-align:center;color:#765463;font-style:italic}button{display:block;margin:20px auto;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.danger{background:#fff0f5}</style></head><body><div class="container"><section class="box"><h1 style="text-align:center;color:#9b4f70">♥ GIVE YOURSELF A REASON ♥</h1><h2 style="text-align:center">prejete ideje ♡</h2><div id="list"><p class="empty">nalagam... ♡</p></div><button id="logout">odjava</button></section></div><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function init(){const {data:{session}}=await c.auth.getSession();if(!session){location.href='login.html';return}const a=await c.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(a.error||!a.data){document.body.innerHTML='<div style="max-width:600px;margin:80px auto;text-align:center;font-family:serif"><h1>Dostop ni dovoljen ♡</h1></div>';return}load()}async function load(){const r=await c.from('ideas').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<p class="empty">Napaka pri nalaganju.</p>';return}if(!r.data.length){$('list').innerHTML='<p class="empty">Trenutno še ni idej. ♡</p>';return}$('list').innerHTML=r.data.map(x=>'<article class="idea"><strong>♡ '+esc(x.nickname)+'</strong><div class="idea-text">'+esc(x.idea)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('sl-SI')+'</div><button class="danger" onclick="del('+x.id+')">izbriši</button></article>').join('')}async function del(id){if(!confirm('Izbrišem idejo?'))return;await c.from('ideas').delete().eq('id',id);load()}$('logout').onclick=async()=>{await c.auth.signOut();location.href='login.html'};init();</script></body></html>
