<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vzdevek ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}main{max-width:560px;margin:70px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}h1{text-align:center;color:#9b4f70;font-size:38px;font-weight:normal}.hearts{text-align:center;color:#c47798;letter-spacing:5px}label{display:block;margin:18px 0 7px;color:#75465a;font-weight:bold}input{width:100%;padding:12px;border:1px dashed #c98ba8;background:#fffafd;font:16px "Times New Roman",serif}button{display:block;margin:20px auto 8px;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.note,.status{text-align:center;line-height:1.5;color:#765463}</style></head><body><main><section class="box"><div class="hearts">♡ ♥ ♡</div><h1>Izberi vzdevek</h1><p class="note">Ni ti treba vnesti e-pošte ali pravega imena. Izberi si vzdevek, ki ga želiš uporabljati v pogovorih. ♡</p><form id="form"><label>tvoj vzdevek</label><input id="nickname" maxlength="30" minlength="1" required autocomplete="nickname" placeholder="npr. Mavrica123"><button>nadaljuj ♡</button></form><p class="status" id="status"></p></section></main><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);async function init(){const {data:{session}}=await c.auth.getSession();if(session){const p=await c.from('profiles').select('nickname').eq('user_id',session.user.id).maybeSingle();if(p.data)location.href='chat.html'}}init();$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const nickname=$('nickname').value.trim();if(!nickname){return}let s=await c.auth.getSession();let session=s.data.session;if(!session){const r=await c.auth.signInAnonymously();if(r.error){$('status').textContent='Anonimna prijava ni omogočena. V Supabase vklopi Anonymous sign-ins.';return}session=r.data.session}const r=await c.from('profiles').upsert({user_id:session.user.id,nickname},{onConflict:'user_id'});if(r.error){$('status').textContent='Vzdevka ni bilo mogoče shraniti.';return}location.href='chat.html'};</script></body></html>
