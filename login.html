<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}main{max-width:560px;margin:70px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}h1{text-align:center;color:#9b4f70;font-size:38px;font-weight:normal}.hearts{text-align:center;color:#c47798;letter-spacing:5px}label{display:block;margin:18px 0 7px;color:#75465a;font-weight:bold}input{width:100%;padding:12px;border:1px dashed #c98ba8;background:#fffafd;font:16px "Times New Roman",serif}button{display:block;margin:20px auto 8px;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.switch{text-align:center;color:#765463}.switch a{color:#9b4f70}.status{text-align:center;line-height:1.5}</style></head><body><main><section class="box"><div class="hearts">♡ ♥ ♡</div><h1 id="title">Ustvari račun</h1><p class="switch" id="desc">Za shranjevanje pogovorov potrebuješ svoj račun.</p><form id="form"><label>e-pošta</label><input id="email" type="email" required autocomplete="email"><label>geslo</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button id="submit">ustvari račun ♡</button></form><p class="switch"><a href="#" id="toggle">Že imam račun</a></p><p class="status" id="status"></p></section></main><script>const {createClient}=supabase;const c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let signup=true;const $=x=>document.getElementById(x);$('toggle').onclick=e=>{e.preventDefault();signup=!signup;$('title').textContent=signup?'Ustvari račun':'Prijava';$('desc').textContent=signup?'Za shranjevanje pogovorov potrebuješ svoj račun.':'Prijavi se v svoj račun in nadaljuj pogovor.';$('submit').textContent=signup?'ustvari račun ♡':'prijavi se ♡';$('toggle').textContent=signup?'Že imam račun':'Še nimam računa'};$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const r=signup?await c.auth.signUp({email:$('email').value.trim(),password:$('password').value}):await c.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('status').textContent=r.error.message;return}if(signup&&!r.data.session){$('status').textContent='Račun je ustvarjen. Preveri e-pošto za potrditev, nato se prijavi.'}else location.href='chat.html'};</script></body></html>
