<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava </title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#263746;font-family:"Times New Roman",serif}main{max-width:560px;margin:70px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #d9e3ec;padding:30px}h1{text-align:center;color:#9b4f70;font-size:38px;font-weight:normal}.hearts{text-align:center;color:#c47798;letter-spacing:5px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;margin:0;padding:10px;border:1px dashed #c98ba8;background:#fffafd;color:#713b54;font:16px "Times New Roman",serif;cursor:pointer}.tabs button.active{background:#e9eff5}.switch{display:flex;gap:8px;margin:15px 0}.switch button{flex:1;padding:8px;border:1px dashed #d5a5ba;background:#fff;color:#713b54;font:15px "Times New Roman",serif;cursor:pointer}.switch button.active{background:#e9eff5}.panel{display:none}.panel.active{display:block}label{display:block;margin:18px 0 7px;color:#75465a;font-weight:bold}input{width:100%;padding:12px;border:1px dashed #c98ba8;background:#fffafd;font:16px "Times New Roman",serif}button.submit{display:block;margin:20px auto 8px;padding:11px 25px;border:1px dashed #5d7891;background:#e9eff5;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.note,.status{text-align:center;line-height:1.5;color:#765463}.home-link{display:block;text-align:center;margin-top:18px;color:#3f6f95;text-decoration:none;font-size:15px}.home-link:hover{text-decoration:underline}</style></head><body><main><section class="box"><div class="hearts">  </div><h1>prijava</h1><div class="tabs"><button id="userTab" class="active" type="button">uporabnik</button><button id="adminTab" type="button">admin</button></div><div id="userPanel" class="panel active"><div class="switch"><button id="registerTab" class="active" type="button">ustvari račun</button><button id="loginTab" type="button">prijavi se</button></div><div id="registerPanel"><p class="note">Ustvari svoj račun za obiskovalce. V chatu se bo prikazal samo tvoj vzdevek. </p><form id="registerForm"><label>tvoj vzdevek</label><input id="nickname" maxlength="30" minlength="1" pattern="[A-Za-zČčŠšŽžÀ-ž0-9]+" title="Vzdevek naj vsebuje samo eno besedo, brez presledkov." required autocomplete="nickname" placeholder="npr. Mavrica123"><label>Gmail / e-pošta</label><input id="userEmail" type="email" required autocomplete="email" placeholder="tvoj@gmail.com"><label>geslo</label><input id="userPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="vsaj 6 znakov"><button class="submit">ustvari račun </button></form></div><div id="loginPanel" style="display:none"><p class="note">Če račun že imaš, se prijavi z istim e-poštnim naslovom in geslom.</p><form id="userLoginForm"><label>Gmail / e-pošta</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="tvoj@gmail.com"><label>geslo</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="submit">prijavi se </button></form></div></div><div id="adminPanel" class="panel"><p class="note">Admin prijava je namenjena samo skrbniku strani.</p><form id="adminForm"><label>Gmail</label><input id="email" type="email" required autocomplete="email" placeholder="tvoj Gmail"><label>geslo</label><input id="password" type="password" required autocomplete="current-password"><button class="submit">prijavi se </button></form></div><p class="status" id="status"></p><a class="home-link" href="home.html">← nazaj na glavno stran</a></section></main><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);function show(which){const user=which==='user';$('userPanel').classList.toggle('active',user);$('adminPanel').classList.toggle('active',!user);$('userTab').classList.toggle('active',user);$('adminTab').classList.toggle('active',!user);$('status').textContent=''}function userMode(which){const reg=which==='register';$('registerPanel').style.display=reg?'block':'none';$('loginPanel').style.display=reg?'none':'block';$('registerTab').classList.toggle('active',reg);$('loginTab').classList.toggle('active',!reg);$('status').textContent=''}$('userTab').onclick=()=>show('user');$('adminTab').onclick=()=>show('admin');$('registerTab').onclick=()=>userMode('register');$('loginTab').onclick=()=>userMode('login');async function goUser(session){if(!session)return false;const p=await c.from('profiles').select('nickname').eq('user_id',session.user.id).maybeSingle();if(p.data){location.href='chat.html';return true}const nickname=(session.user.user_metadata&&session.user.user_metadata.nickname||'').trim();if(nickname&&/^[A-Za-zČčŠšŽžÀ-ž0-9]+$/.test(nickname)&&nickname.toLowerCase()!=='emi'&&nickname.toLowerCase()!=='emihost'){const ins=await c.from('profiles').insert({user_id:session.user.id,nickname});if(!ins.error){location.href='chat.html';return true}}return false}$('registerForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const nickname=$('nickname').value.trim(),email=$('userEmail').value.trim().toLowerCase(),password=$('userPassword').value;if(!nickname||!email||password.length<6)return;if(!/^[A-Za-zČčŠšŽžÀ-ž0-9]+$/.test(nickname)){ $('status').textContent='Vzdevek naj vsebuje samo eno besedo, brez presledkov.';return }if(nickname.toLowerCase()==='emi'||nickname.toLowerCase()==='emihost'){ $('status').textContent='Ta vzdevek je rezerviran.';return}const available=await c.rpc('nickname_available',{p_nickname:nickname});if(available.error){$('status').textContent='Najprej moraš v Supabase zagnati zadnjo verzijo supabase.sql.';return}if(!available.data){$('status').textContent='Ta vzdevek je že zaseden ali rezerviran. Izberi drugega.';return}await c.auth.signOut();const r=await c.auth.signUp({email,password,options:{data:{nickname}}});if(r.error){$('status').textContent=r.error.message.toLowerCase().includes('already registered')?'Ta e-pošta je že registrirana. Uporabi prijavo.':'Računa ni bilo mogoče ustvariti. Preveri e-pošto in geslo.';return}if(r.data.session){if(await goUser(r.data.session))return;$('status').textContent='Račun je ustvarjen, vendar vzdevka ni bilo mogoče shraniti.';return}$('status').textContent='Račun je ustvarjen. Potrdi e-pošto, nato spodaj izberi »prijavi se«. ';userMode('login')};$('userLoginForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const email=$('loginEmail').value.trim().toLowerCase(),password=$('loginPassword').value;if(!email||!password)return;await c.auth.signOut();const r=await c.auth.signInWithPassword({email,password});if(r.error){$('status').textContent='E-pošta ali geslo nista pravilna.';return}if(!(await goUser(r.data.session))){await c.auth.signOut();$('status').textContent='Za ta račun še ni shranjen veljaven vzdevek.'}};$('adminForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return;await c.auth.signOut();const r=await c.auth.signInWithPassword({email,password});if(r.error){$('status').textContent='Gmail ali geslo nista pravilna.';return}const a=await c.rpc('is_admin');if(a.error||!a.data){await c.auth.signOut();$('status').textContent='Ta račun ni nastavljen kot admin.';return}location.href='admin.html'};async function init(){const adminOnly=new URLSearchParams(location.search).get('admin')==='1';if(adminOnly){show('admin');$('userTab').style.display='none';$('adminTab').style.display='none';$('userPanel').classList.remove('active');$('adminPanel').classList.add('active');return}const {data:{session}}=await c.auth.getSession();if(!session)return;if(session.user.is_anonymous){if(await goUser(session))return;return}if(await goUser(session))return;await c.auth.signOut()}init();</script></body></html>
