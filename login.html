<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}main{max-width:560px;margin:70px auto;padding:20px}.box{background:#fff;border:1px dashed #d9a9bf;box-shadow:6px 7px 0 #f1d6e2;padding:30px}h1{text-align:center;color:#9b4f70;font-size:38px;font-weight:normal}.hearts{text-align:center;color:#c47798;letter-spacing:5px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;margin:0;padding:10px;border:1px dashed #c98ba8;background:#fffafd;color:#713b54;font:16px "Times New Roman",serif;cursor:pointer}.tabs button.active{background:#fcebf3}.panel{display:none}.panel.active{display:block}label{display:block;margin:18px 0 7px;color:#75465a;font-weight:bold}input{width:100%;padding:12px;border:1px dashed #c98ba8;background:#fffafd;font:16px "Times New Roman",serif}button.submit{display:block;margin:20px auto 8px;padding:11px 25px;border:1px dashed #a95778;background:#fcebf3;color:#713b54;font:17px "Times New Roman",serif;cursor:pointer}.note,.status{text-align:center;line-height:1.5;color:#765463}.home-link{display:block;text-align:center;margin-top:18px;color:#d95b83;text-decoration:none;font-size:15px}.home-link:hover{text-decoration:underline}</style></head><body><main><section class="box"><div class="hearts">♡ ♥ ♡</div><h1>prijava</h1><div class="tabs"><button id="userTab" class="active" type="button">uporabnik</button><button id="adminTab" type="button">admin</button></div><div id="userPanel" class="panel active"><p class="note">Izberi vzdevek, ki ga želiš uporabljati v pogovorih. ♡</p><form id="userForm"><label>tvoj vzdevek</label><input id="nickname" maxlength="30" minlength="1" required autocomplete="nickname" placeholder="npr. Mavrica123"><button class="submit">nadaljuj ♡</button></form></div><div id="adminPanel" class="panel"><p class="note">Admin prijava je namenjena samo skrbniku strani.</p><form id="adminForm"><label>Gmail</label><input id="email" type="email" required autocomplete="email" placeholder="tvoj Gmail"><label>geslo</label><input id="password" type="password" required autocomplete="current-password"><button class="submit">prijavi se ♡</button></form></div><p class="status" id="status"></p><a class="home-link" href="home.html">← nazaj na glavno stran</a></section></main><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);function show(which){const user=which==='user';$('userPanel').classList.toggle('active',user);$('adminPanel').classList.toggle('active',!user);$('userTab').classList.toggle('active',user);$('adminTab').classList.toggle('active',!user);$('status').textContent=''}$('userTab').onclick=()=>show('user');$('adminTab').onclick=()=>show('admin');async function hasProfile(session){if(!session)return false;const p=await c.from('profiles').select('nickname').eq('user_id',session.user.id).maybeSingle();return !!p.data}$('userForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const nickname=$('nickname').value.trim();if(!nickname)return;let s=await c.auth.getSession();let session=s.data.session;if(session&&!session.user.is_anonymous){const a=await c.rpc('is_admin');if(a.data){location.href='admin.html';return}await c.auth.signOut();session=null}if(!session){const r=await c.auth.signInAnonymously();if(r.error){$('status').textContent='Prijava za uporabnike trenutno ni omogočena. V Supabase vklopi Anonymous sign-ins.';return}session=r.data.session}const r=await c.from('profiles').upsert({user_id:session.user.id,nickname},{onConflict:'user_id'});if(r.error){$('status').textContent='Vzdevka ni bilo mogoče shraniti. Preveri supabase nastavitve.';return}location.href='chat.html'};$('adminForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='';const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return;await c.auth.signOut();const r=await c.auth.signInWithPassword({email,password});if(r.error){$('status').textContent='Gmail ali geslo nista pravilna.';return}const a=await c.rpc('is_admin');if(a.error||!a.data){await c.auth.signOut();$('status').textContent='Ta račun ni nastavljen kot admin.';return}location.href='admin.html'};async function init(){const {data:{session}}=await c.auth.getSession();if(!session)return;if(session.user.is_anonymous){if(await hasProfile(session))location.href='chat.html';return}const a=await c.rpc('is_admin');if(a.data){location.href='admin.html';return}await c.auth.signOut()}init();</script></body></html>
