<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pogovori ♡</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:#3b2632;font-family:"Times New Roman",serif}header{text-align:center;padding:25px 10px 18px;border-bottom:1px dashed #d9a9bf}header h1{margin:0;font-size:30px;font-weight:normal}nav a{color:#3b2632;text-decoration:none;margin:0 8px}.container{width:90%;max-width:850px;margin:auto}.intro{text-align:center;padding:40px 20px 25px}.intro h2{font-size:34px;font-weight:normal}.heart{color:#d95b83}.account{color:#765463;font-size:14px}.account button,.write button{padding:10px 18px;border:1px solid #d9a9bf;background:#fceaf2;font:15px "Times New Roman",serif;cursor:pointer}.messages{height:430px;overflow-y:auto;background:#fff;border-top:1px dashed #d9a9bf;border-bottom:1px dashed #d9a9bf;padding:22px}.message{margin-bottom:17px;line-height:1.45}.name{color:#d95b83;font-weight:bold}.text{white-space:pre-wrap;word-break:break-word}.empty{text-align:center;margin-top:160px;color:#98717f;font-style:italic}.write{display:flex;gap:10px;margin-top:15px}.write input{flex:1;padding:12px;border:1px solid #d9a9bf;font:16px "Times New Roman",serif}.rules{text-align:center;margin:30px auto;max-width:650px;font-size:14px;line-height:1.6;color:#6e505d}@media(max-width:600px){.write{flex-direction:column}.write button{width:100%}}</style></head><body><header><h1>♥ GIVE YOURSELF A REASON ♥</h1><nav><a href="home.html">domov</a> ♥ <a href="ideje.html">ideje</a></nav></header><main class="container"><section class="intro"><h2>Pogovori <span class="heart">♡</span></h2><p>Uporabljaš lahko samo svoj vzdevek — e-pošta se tukaj ne prikazuje.</p><div class="account"><span id="account"></span> · <button id="change">spremeni vzdevek</button></div></section><section class="messages" id="messages"><div class="empty">nalagam pogovor... ♡</div></section><div class="write"><input id="input" maxlength="5000" placeholder="napiši nekaj..." autocomplete="off"><button id="send">pošlji ♡</button></div><section class="rules">♡ Ne objavljaj osebnih podatkov. Če ti je res težko, se obrni tudi na odraslo osebo, ki ji zaupaš.</section></main><script>const {createClient}=supabase,c=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let user,chatId,nickname;const $=x=>document.getElementById(x);async function init(){const {data:{session}}=await c.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const p=await c.from('profiles').select('nickname').eq('user_id',user.id).maybeSingle();if(!p.data){location.href='login.html';return}nickname=p.data.nickname;$('account').textContent=nickname;let r=await c.from('chats').select('*').eq('user_id',user.id).maybeSingle();if(!r.data){r=await c.from('chats').insert({user_id:user.id}).select().single()}if(r.error){$('messages').innerHTML='<div class="empty">Napaka pri ustvarjanju pogovora.</div>';return}chatId=r.data.id;load()}async function load(){const r=await c.from('messages').select('*').eq('chat_id',chatId).order('created_at');const box=$('messages');box.innerHTML='';if(r.error||!r.data.length){box.innerHTML='<div class="empty">tukaj še ni sporočil...<br>mogoče bo tvoje prvo. ♡</div>';return}r.data.forEach(add);box.scrollTop=box.scrollHeight}function add(m){const e=document.createElement('div'),n=document.createElement('div'),t=document.createElement('div');e.className='message';n.className='name';t.className='text';n.textContent=m.role==='user'?nickname+' ♡':'GIVE YOURSELF A REASON ♡';t.textContent=m.content;e.append(n,t);$('messages').append(e)}async function send(){const i=$('input'),text=i.value.trim();if(!text)return;i.disabled=true;const r=await c.from('messages').insert({chat_id:chatId,user_id:user.id,role:'user',content:text}).select().single();i.disabled=false;if(r.error){alert('Sporočila ni bilo mogoče shraniti.');return}const empty=$('messages').querySelector('.empty');if(empty)empty.remove();add(r.data);i.value='';i.focus();$('messages').scrollTop=$('messages').scrollHeight}$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('change').onclick=()=>location.href='login.html';init();</script></body></html>
